<!-- CALC / FORM -->
<section id="calc" class="py-24 md:py-32 bg-sand">
  <div class="max-w-5xl mx-auto px-6">
    <div class="text-center mb-12">
      <p class="text-sea text-xs uppercase tracking-[0.2em] mb-3">05 — Request</p>
      <h2 data-i18n="calc.title" class="font-display text-4xl md:text-5xl font-semibold text-navy mb-3"></h2>
      <p data-i18n="calc.sub" class="text-ink/70"></p>
    </div>
    <form id="calc-form" class="bg-white shadow-elegant rounded-3xl p-8 md:p-10 grid sm:grid-cols-2 gap-5">
      <label class="text-sm sm:col-span-2"><span data-i18n="calc.type" class="text-navy/80"></span>
        <select name="type" id="f-type" class="mt-1 w-full border border-navy/15 rounded-xl px-4 py-3 bg-sand/40 focus:outline-none focus:border-sea"></select>
      </label>
      <label class="text-sm"><span data-i18n="calc.name" class="text-navy/80"></span>
        <input name="name" required class="mt-1 w-full border border-navy/15 rounded-xl px-4 py-3 bg-sand/40 focus:outline-none focus:border-sea" />
      </label>
      <label class="text-sm"><span data-i18n="calc.phone" class="text-navy/80"></span>
        <input name="phone" required class="mt-1 w-full border border-navy/15 rounded-xl px-4 py-3 bg-sand/40 focus:outline-none focus:border-sea" />
      </label>
      <label class="text-sm sm:col-span-2"><span data-i18n="calc.email" class="text-navy/80"></span>
        <input name="email" type="email" class="mt-1 w-full border border-navy/15 rounded-xl px-4 py-3 bg-sand/40 focus:outline-none focus:border-sea" />
      </label>
      <label class="text-sm"><span data-i18n="calc.value" class="text-navy/80"></span>
        <input name="value" id="f-value" type="number" min="0" class="mt-1 w-full border border-navy/15 rounded-xl px-4 py-3 bg-sand/40 focus:outline-none focus:border-sea" />
      </label>
      <label class="text-sm"><span data-i18n="calc.origin" class="text-navy/80"></span>
        <input name="origin" class="mt-1 w-full border border-navy/15 rounded-xl px-4 py-3 bg-sand/40 focus:outline-none focus:border-sea" />
      </label>
      <label class="text-sm sm:col-span-2"><span data-i18n="calc.cargo" class="text-navy/80"></span>
        <textarea name="cargo" rows="3" class="mt-1 w-full border border-navy/15 rounded-xl px-4 py-3 bg-sand/40 focus:outline-none focus:border-sea"></textarea>
      </label>
      <div class="sm:col-span-2 bg-gradient-sea text-sand rounded-2xl p-5 flex items-center justify-between">
        <div>
          <div data-i18n="calc.estimate" class="text-xs uppercase tracking-wider text-sea-glow"></div>
          <div id="estimate" class="font-display text-3xl mt-1">€ 30</div>
          <div data-i18n="calc.estimateNote" class="text-xs text-sand/70 mt-1"></div>
        </div>
      </div>
      <div class="sm:col-span-2 flex flex-wrap gap-3 justify-end">
        <button type="button" id="send-wa"    class="bg-[#25D366] text-white font-semibold px-6 py-3 rounded-full hover:opacity-90">WhatsApp</button>
        <button type="submit" data-i18n="calc.submit" class="bg-gradient-gold text-navy font-semibold px-6 py-3 rounded-full hover:shadow-glow transition"></button>
      </div>
    </form>
  </div>
</section>

let lang = localStorage.getItem('lang') || 'bg';

function get(path, obj){ return path.split('.').reduce((o,k)=>o&&o[k], obj); }

function render(){
  const t = translations[lang];
  document.documentElement.lang = lang;
  // i18n attributes
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v = get(el.dataset.i18n, t);
    if (typeof v === 'string') el.textContent = v;
  });
  // lang buttons
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('bg-gradient-gold', b.dataset.lang===lang);
    b.classList.toggle('text-navy', b.dataset.lang===lang);
    b.classList.toggle('text-sand/70', b.dataset.lang!==lang);
  });
  // trust bar
  document.getElementById('trust').innerHTML = t.trust.map(x=>`<span>${x}</span>`).join('<span class="text-gold/60">•</span>');
  // services
  document.getElementById('services-grid').innerHTML = t.services.items.map((it,i)=>`
    <div class="group bg-white border border-navy/5 rounded-2xl p-6 hover:shadow-elegant hover:-translate-y-1 transition">
      <div class="w-10 h-10 rounded-xl bg-gradient-sea text-sand grid place-items-center font-display mb-4">${String(i+1).padStart(2,'0')}</div>
      <h3 class="font-display text-xl font-semibold text-navy mb-2">${it.t}</h3>
      <p class="text-ink/70 text-sm leading-relaxed">${it.d}</p>
    </div>`).join('');
  // process
  document.getElementById('process-grid').innerHTML = t.process.steps.map((s,i)=>`
    <div class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-6 relative">
      <div class="font-display text-5xl text-gold-light/40 absolute top-4 right-4">${i+1}</div>
      <h3 class="font-display text-xl font-semibold mb-2">${s.t}</h3>
      <p class="text-sand/70 text-sm">${s.d}</p>
    </div>`).join('');
  // faq
  document.getElementById('faq-list').innerHTML = t.faq.items.map(it=>`
    <details class="py-5">
      <summary class="flex justify-between gap-4 items-center font-display text-lg font-semibold text-navy hover:text-sea">
        <span>${it.q}</span>
        <svg class="chev w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </summary>
      <p class="text-ink/70 leading-relaxed mt-3">${it.a}</p>
    </details>`).join('');
  // reviews
  document.getElementById('reviews-grid').innerHTML = t.reviews.items.map(r=>`
    <div class="bg-white/5 border border-white/10 rounded-2xl p-6 backdrop-blur">
      <div class="text-gold-light text-lg mb-3">★★★★★</div>
      <p class="text-sand/90 mb-5">"${r.t}"</p>
      <div class="text-sm text-sand/60 flex justify-between"><span>${r.n}</span><span>${r.d}</span></div>
    </div>`).join('');
  // service select
  const sel = document.getElementById('f-type');
  sel.innerHTML = t.calc.types.map(x=>`<option>${x}</option>`).join('');
  // contacts
  document.getElementById('c-address').textContent = t.contacts.address;
  const ph = document.getElementById('c-phone'); ph.textContent = COMPANY.phone; ph.href = 'tel:'+COMPANY.phoneTel;
  const em = document.getElementById('c-email'); em.textContent = COMPANY.email; em.href = 'mailto:'+COMPANY.email;
}

function calcEstimate(){
  const v = parseFloat(document.getElementById('f-value').value)||0;
  const fee = Math.max(30, 30 + v*0.006);
  document.getElementById('estimate').textContent = '€ ' + fee.toFixed(2);
}

function buildMessage(fd){
  const t = translations[lang];
  return `${t.calc.title}%0A`+
    `• ${t.calc.type}: ${fd.get('type')||''}%0A`+
    `• ${t.calc.name}: ${fd.get('name')||''}%0A`+
    `• ${t.calc.phone}: ${fd.get('phone')||''}%0A`+
    `• ${t.calc.email}: ${fd.get('email')||''}%0A`+
    `• ${t.calc.value}: ${fd.get('value')||''} EUR%0A`+
    `• ${t.calc.origin}: ${fd.get('origin')||''}%0A`+
    `• ${t.calc.cargo}: ${fd.get('cargo')||''}`;
}

document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('year').textContent = new Date().getFullYear();
  render();
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ lang = b.dataset.lang; localStorage.setItem('lang', lang); render(); });
  });
  document.getElementById('f-value').addEventListener('input', calcEstimate);
  const form = document.getElementById('calc-form');
  form.addEventListener('submit', e=>{
    e.preventDefault();
    const msg = buildMessage(new FormData(form));
    window.location.href = `mailto:${COMPANY.email}?subject=${encodeURIComponent('Request — Alena-Service')}&body=${msg}`;
  });
  document.getElementById('send-wa').addEventListener('click', ()=>{
    const msg = buildMessage(new FormData(form));
    window.open(`https://wa.me/${COMPANY.whatsapp}?text=${msg}`, '_blank');
  });
  // fade in
  const io = new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('in')),{threshold:0.15});
  document.querySelectorAll('.fade-up').forEach(el=>io.observe(el));
});
</script>
